# Development profile overrides
spring:
  config:
    activate:
      on-profile: dev

  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME:admin}:${MONGO_PASSWORD:admin}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/smartenergy?authSource=admin

logging:
  level:
    com.smartenergy: DEBUG
    org.springframework.web: DEBUG
