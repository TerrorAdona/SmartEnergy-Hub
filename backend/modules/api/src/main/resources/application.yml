spring:
  application:
    name: smartenergy-api

  task:
    scheduling:
      pool:
        size: 4

  # Jackson configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false

  cassandra:
    contact-points: ${CASSANDRA_HOST:localhost}
    port: ${CASSANDRA_PORT:9042}
    keyspace-name: smartenergy
    local-datacenter: ${CASSANDRA_LOCAL_DC:dc1}
    schema-action: CREATE_IF_NOT_EXISTS
    connection:
      connect-timeout: 10s
      init-query-timeout: 10s
    request:
      timeout: 10s
      consistency: LOCAL_QUORUM

  data:
    # MongoDB configuration
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/smartenergy
      auto-index-creation: true

    # Redis configuration
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Must stay above the Redis Streams BLOCK duration (app.sensor.stream.poll-timeout).
      timeout: 15s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# SpringDoc OpenAPI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.smartenergy.api.controller
  paths-to-match: /api/v1/**
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

# Actuator configuration. env and configprops stay closed so secrets are not exposed.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

# Logging configuration
logging:
  level:
    root: INFO
    com.smartenergy: INFO
    org.springframework.data.cassandra: WARN
    org.springframework.data.mongodb: WARN
    org.springframework.data.redis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Controllers declare the /api/v1 prefix. There is no servlet context path.
server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  forward-headers-strategy: framework

# Custom application properties
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  sensor:
    stream:
      key: sensor:readings
      consumer-group: measurement-ingestion
      consumer-name: measurement-writer
      dead-letter-key: sensor:readings:dead-letter
      batch-size: 100
      poll-timeout: 5000
      poll-interval-ms: 1000
      pending-idle-time: 30s
      max-deliveries: 5
  measurement:
    retention-days: 30
    aggregation-enabled: true
  simulation:
    interval-ms: 5000
  analytics:
    aggregation-cron: "0 0 * * * *" # hourly
    alert-check-cron: "0 * * * * *" # every minute
