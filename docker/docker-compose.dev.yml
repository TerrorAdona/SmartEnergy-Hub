  #     - MONGO_HOST=mongodb
  #     - REDIS_HOST=redis
  #   depends_on:
  #     cassandra:
  #       condition: service_healthy
  #     mongodb:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - smartenergy-network

