# Development overrides - enables hot reload and debugging
version: '3.8'

services:
  cassandra:
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CONFIG=/etc/cassandra
    volumes:
      - ./init/cassandra:/docker-entrypoint-initdb.d

  mongodb:
    ports:
      - "27017:27017"

  redis:
    ports:
      - "6379:6379"

  # Backend API (run locally via ./gradlew :modules:api:bootRun)
