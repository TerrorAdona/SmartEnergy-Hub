global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: smartenergy-dev
    environment: development

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: smartenergy-api
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["backend:8080"]
        labels:
          application: smartenergy-api
